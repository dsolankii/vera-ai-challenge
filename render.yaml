services:
  - type: web
    name: vera-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /v1/healthz
    envVars:
      - key: TEAM_NAME
        value: Vera Engine
      - key: TEAM_MEMBERS
        value: Darshan Solanki
      - key: CONTACT_EMAIL
        value: soldarshu@gmail.com
      - key: VERA_LLM_REWRITE
        value: "0"
